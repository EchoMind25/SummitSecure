[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SITE_URL = "https://summitsecure.netlify.app"
  # Set these in Netlify dashboard:
  # NEXT_PUBLIC_SUPABASE_URL
  # NEXT_PUBLIC_SUPABASE_ANON_KEY
  # SUPABASE_SERVICE_ROLE_KEY

# Build hooks
[build.hooks]
  prebuild = "echo '🚀 Starting secure Summit Secure build (CVE-2025-55182/66478 patched)...'"
  postbuild = "echo '✅ Build completed successfully - all security patches applied!'"

# Security headers (enhanced CSP)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' *.supabase.co; frame-ancestors 'none';"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/_next/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API routes redirect
[[redirects]]
  from = "/api/auth/callback"
  to = "/api/auth/callback"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

